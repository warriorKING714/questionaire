<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Romantic Quiz 💘</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffe6f2;
      text-align: center;
      margin: 50px;
    }
    h1 { color: #d10068; }
    .question { margin: 20px 0; font-size: 1.2em; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 5px;
      border: none;
      color: white;
      background: #d10068;
      border-radius: 5px;
      cursor: pointer;
    }
    #result { margin-top: 30px; font-size: 1.4em; color: #800040; }
  </style>
</head>
<body>

  <h1>💘 Romantic Questionnaire 💘</h1>

  <div id="quiz">

    <div class="question" id="q1">
      <p>1. Do you believe in love at first sight?</p>
      <button onclick="answer('q1', 'yes')">Yes</button>
      <button onclick="answer('q1', 'no')">No</button>
    </div>

    <div class="question" id="q2" style="display:none;">
      <p>2. Do you enjoy planning romantic dates?</p>
      <button onclick="answer('q2', 'yes')">Yes</button>
      <button onclick="answer('q2', 'no')">No</button>
    </div>

    <div class="question" id="q3" style="display:none;">
      <p>3. Would you write a love note for someone?</p>
      <button onclick="answer('q3', 'yes')">Yes</button>
      <button onclick="answer('q3', 'no')">No</button>
    </div>

    <div class="question" id="q4" style="display:none;">
      <p>4. Is a sunset dinner romantic to you?</p>
      <button onclick="answer('q4', 'yes')">Yes</button>
      <button onclick="answer('q4', 'no')">No</button>
    </div>

  </div>

  <p id="result"></p>

  <script>
    let score = 0;
    function answer(q, choice) {
      if (choice === 'yes') score++;
      document.getElementById(q).style.display = 'none';

      // show next
      if (q === 'q1') document.getElementById('q2').style.display = '';
      else if (q === 'q2') document.getElementById('q3').style.display = '';
      else if (q === 'q3') document.getElementById('q4').style.display = '';
      else if (q === 'q4') showResult();
    }

    function showResult() {
      let text = '';
      if (score === 4) text = "You are a Hopeless Romantic! 💖";
      else if (score >= 2) text = "You have a Romantic Soul! 🌹";
      else text = "You’re more Chill Than Romantic — and that’s cool too! 😊";
      document.getElementById('result').innerText = text;
    }
  </script>

</body>
</html>
